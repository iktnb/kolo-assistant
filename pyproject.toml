[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kolo-assistant"
version = "1.1.0"
description = "Коло — локальні контакти, нотатки й дні народження"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["rich>=14.2,<15", "textual==8.2.8"]

[project.scripts]
kolo = "kolo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kolo"]

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.18", "pytest>=8.4", "pytest-cov>=7", "bandit>=1.8", "pip-audit>=2.9"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/kolo"]

[tool.coverage.report]
show_missing = true
fail_under = 80
